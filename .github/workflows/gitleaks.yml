name: Secret scan

# Guards against a repeat of the NewsAPI/GNews keys that were previously
# committed in predictor/news_sentiment.py.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repos. Private repos need GITLEAKS_LICENSE:
          # https://github.com/gitleaks/gitleaks-action#license
